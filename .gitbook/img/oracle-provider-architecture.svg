<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0082FA"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="440" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="30" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle" letter-spacing="0.5">ORACLE PROVIDER ARCHITECTURE</text>

  <!-- ==================== -->
  <!-- OFF-CHAIN SIDE       -->
  <!-- ==================== -->
  <text x="140" y="60" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5" text-anchor="middle">OFF-CHAIN</text>

  <!-- Divider -->
  <line x1="310" y1="48" x2="310" y2="280" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ==================== -->
  <!-- ON-CHAIN SIDE        -->
  <!-- ==================== -->
  <text x="560" y="60" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5" text-anchor="middle">ON-CHAIN (INJECTIVE)</text>

  <!-- External data sources -->
  <rect x="30" y="80" width="120" height="50" rx="8" fill="white" filter="url(#shadow)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="90" y="102" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">CEX Prices</text>
  <text x="90" y="118" font-size="9" fill="#64748b" text-anchor="middle">Binance, Coinbase...</text>

  <rect x="30" y="145" width="120" height="50" rx="8" fill="white" filter="url(#shadow)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="90" y="167" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Internal Systems</text>
  <text x="90" y="183" font-size="9" fill="#64748b" text-anchor="middle">Collateral data, NAV</text>

  <rect x="30" y="210" width="120" height="50" rx="8" fill="white" filter="url(#shadow)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="90" y="232" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Other APIs</text>
  <text x="90" y="248" font-size="9" fill="#64748b" text-anchor="middle">FX rates, indices...</text>

  <!-- Arrows from sources to relayer -->
  <path d="M 150 105 L 178 150" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arrowPurple)"/>
  <path d="M 150 170 L 178 170" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arrowPurple)"/>
  <path d="M 150 235 L 178 190" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- Relayer service -->
  <rect x="190" y="130" width="100" height="80" rx="10" fill="white" filter="url(#shadow)" stroke="#0082FA" stroke-width="2"/>
  <text x="240" y="158" font-size="11" font-weight="700" fill="#0082FA" text-anchor="middle">Relayer</text>
  <text x="240" y="175" font-size="9" fill="#64748b" text-anchor="middle">Your service</text>
  <text x="240" y="190" font-size="9" fill="#64748b" text-anchor="middle">Whitelisted addr</text>

  <!-- Arrow from relayer to oracle module -->
  <path d="M 290 170 L 368 170" stroke="#0082FA" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="320" y="160" font-size="8" fill="#0082FA" font-weight="500">MsgRelayProviderPrices</text>

  <!-- Oracle Module -->
  <rect x="380" y="100" width="190" height="140" rx="12" fill="white" filter="url(#shadow)" stroke="#0082FA" stroke-width="2"/>
  <rect x="380" y="100" width="190" height="32" rx="12" fill="#0082FA"/>
  <rect x="380" y="120" width="190" height="12" fill="#0082FA"/>
  <text x="475" y="121" font-size="12" font-weight="700" fill="white" text-anchor="middle">Oracle Module</text>

  <text x="400" y="156" font-size="10" font-weight="600" fill="#1e293b">Provider namespace</text>
  <text x="400" y="172" font-size="9" fill="#64748b">Stores price feeds per provider</text>

  <rect x="400" y="185" width="150" height="36" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="475" y="203" font-size="10" font-weight="500" fill="#0369a1" text-anchor="middle">BTC/USD: $65,000</text>
  <text x="475" y="215" font-size="10" font-weight="500" fill="#0369a1" text-anchor="middle">ETH/USD: $3,200</text>

  <!-- ==================== -->
  <!-- SETUP FLOW           -->
  <!-- ==================== -->
  <text x="30" y="310" font-size="12" font-weight="700" fill="#0082FA" letter-spacing="0.5">SETUP FLOW</text>

  <rect x="30" y="325" width="170" height="56" rx="10" fill="white" filter="url(#shadow)" stroke="#0082FA" stroke-width="1.5"/>
  <text x="48" y="348" font-size="10" font-weight="700" fill="#0082FA">1</text>
  <text x="62" y="348" font-size="11" font-weight="600" fill="#1e293b">Register Provider</text>
  <text x="48" y="366" font-size="9" fill="#64748b">Governance proposal</text>

  <path d="M 200 353 L 222 353" stroke="#0082FA" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>

  <rect x="232" y="325" width="170" height="56" rx="10" fill="white" filter="url(#shadow)" stroke="#0082FA" stroke-width="1.5"/>
  <text x="250" y="348" font-size="10" font-weight="700" fill="#0082FA">2</text>
  <text x="264" y="348" font-size="11" font-weight="600" fill="#1e293b">Relay Prices</text>
  <text x="250" y="366" font-size="9" fill="#64748b">MsgRelayProviderPrices</text>

  <path d="M 402 353 L 424 353" stroke="#0082FA" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>

  <rect x="434" y="325" width="170" height="56" rx="10" fill="white" filter="url(#shadow)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="452" y="348" font-size="10" font-weight="700" fill="#16a34a">3</text>
  <text x="466" y="348" font-size="11" font-weight="600" fill="#1e293b">Use in DeFi</text>
  <text x="452" y="366" font-size="9" fill="#64748b">Markets, lending, collateral</text>

  <!-- What consumes oracle data -->
  <text x="640" y="90" font-size="10" font-weight="700" fill="#16a34a" letter-spacing="0.5">CONSUMERS</text>

  <rect x="620" y="105" width="150" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="695" y="129" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Perpetual Markets</text>

  <rect x="620" y="153" width="150" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="695" y="177" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Expiry Futures</text>

  <rect x="620" y="201" width="150" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="695" y="225" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Lending Protocols</text>

  <rect x="620" y="249" width="150" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="695" y="273" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Collateral Valuation</text>

  <!-- Arrows from oracle to consumers -->
  <path d="M 570 170 L 618 124" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 570 170 L 618 172" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 570 170 L 618 220" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 570 190 L 618 268" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- Bottom note -->
  <text x="400" y="420" font-size="10" fill="#94a3b8" text-anchor="middle">Each provider has its own namespace. Multiple relayers can be whitelisted per provider.</text>
</svg>
