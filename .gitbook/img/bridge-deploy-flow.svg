<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0082FA"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="480" rx="16" fill="url(#bg)"/>

  <!-- Region labels -->
  <text x="100" y="36" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">ETHEREUM</text>
  <text x="470" y="36" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">INJECTIVE</text>

  <!-- Divider -->
  <line x1="300" y1="20" x2="300" y2="240" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Step 1: Bridge -->
  <rect x="40" y="65" width="220" height="80" rx="12" fill="white" filter="url(#shadow)" stroke="#0082FA" stroke-width="2"/>
  <text x="62" y="94" font-size="11" font-weight="700" fill="#0082FA">STEP 1</text>
  <text x="62" y="116" font-size="14" font-weight="600" fill="#1e293b">Bridge via Peggy</text>
  <text x="62" y="134" font-size="11" fill="#64748b">Approve + sendToInjective</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 260 105 L 348 105" stroke="#0082FA" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: MTS Token Pair -->
  <rect x="360" y="65" width="220" height="80" rx="12" fill="white" filter="url(#shadow)" stroke="#0082FA" stroke-width="2"/>
  <text x="382" y="94" font-size="11" font-weight="700" fill="#0082FA">STEP 2</text>
  <text x="382" y="116" font-size="14" font-weight="600" fill="#1e293b">Create MTS Token Pair</text>
  <text x="382" y="134" font-size="11" fill="#64748b">EVM + Native visibility</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 470 145 L 470 175" stroke="#0082FA" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- Step 3: Metadata -->
  <rect x="360" y="188" width="220" height="80" rx="12" fill="white" filter="url(#shadow)" stroke="#0082FA" stroke-width="2"/>
  <text x="382" y="217" font-size="11" font-weight="700" fill="#0082FA">STEP 3</text>
  <text x="382" y="239" font-size="14" font-weight="600" fill="#1e293b">Set Token Metadata</text>
  <text x="382" y="257" font-size="11" fill="#64748b">Governance proposal</text>

  <!-- Vertical trunk line down from Step 3 -->
  <path d="M 470 268 L 470 330" stroke="#16a34a" stroke-width="2" fill="none"/>

  <!-- Label centered between Lending Protocol and Vaults -->
  <text x="380" y="310" font-size="10" font-weight="700" fill="#16a34a" letter-spacing="0.5" text-anchor="middle">WHAT YOU CAN BUILD</text>

  <!-- Horizontal generation line -->
  <line x1="100" y1="330" x2="660" y2="330" stroke="#16a34a" stroke-width="2"/>

  <!-- Vertical drops to each box -->
  <line x1="100" y1="330" x2="100" y2="360" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="290" y1="330" x2="290" y2="360" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="470" y1="330" x2="470" y2="360" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="660" y1="330" x2="660" y2="360" stroke="#16a34a" stroke-width="1.5"/>

  <!-- 4 option boxes, centered on their drop lines -->
  <!-- Spot Market -->
  <rect x="25" y="360" width="150" height="70" rx="10" fill="white" filter="url(#shadow)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="48" y="390" font-size="13" font-weight="600" fill="#1e293b">Spot Market</text>
  <text x="48" y="410" font-size="10" fill="#64748b">Native CLOB</text>
  <text x="48" y="422" font-size="10" fill="#64748b">Maker rebates</text>

  <!-- Lending -->
  <rect x="215" y="360" width="150" height="70" rx="10" fill="white" filter="url(#shadow)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="238" y="390" font-size="13" font-weight="600" fill="#1e293b">Lending Protocol</text>
  <text x="238" y="410" font-size="10" fill="#64748b">Collateral</text>
  <text x="238" y="422" font-size="10" fill="#64748b">Liquidations</text>

  <!-- Vaults -->
  <rect x="395" y="360" width="150" height="70" rx="10" fill="white" filter="url(#shadow)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="418" y="390" font-size="13" font-weight="600" fill="#1e293b">Vaults</text>
  <text x="418" y="410" font-size="10" fill="#64748b">Yield strategies</text>
  <text x="418" y="422" font-size="10" fill="#64748b">Mito</text>

  <!-- Oracles -->
  <rect x="585" y="360" width="150" height="70" rx="10" fill="white" filter="url(#shadow)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="608" y="390" font-size="13" font-weight="600" fill="#1e293b">Oracle Feeds</text>
  <text x="608" y="410" font-size="10" fill="#64748b">Custom price data</text>
  <text x="608" y="422" font-size="10" fill="#64748b">On-chain</text>
</svg>
